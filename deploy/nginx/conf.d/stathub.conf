server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

upstream stathub_api {
    server api:8080;
    keepalive 16;
}

# Для WebSocket (SignalR) передаём Upgrade, для обычных запросов держим keepalive к API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Публичная витрина: http://<IP>/
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/sites/public;

    include /etc/nginx/snippets/stathub-app.conf;
}

# Админка организатора: http://<IP>:8081/
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/sites/admin;

    # Логотипы до 10 МБ (LogoFile.MaxRequestBytes) + запас на multipart.
    client_max_body_size 11m;

    include /etc/nginx/snippets/stathub-app.conf;
}
