server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

upstream stathub_api {
    server api:8080;
    keepalive 16;
}

# Для WebSocket (SignalR) передаём Upgrade, для обычных запросов держим keepalive к API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Домены (punycode):
#   xn--80aad5dfbv.xn--p1ai        = статхаб.рф        — публичная витрина
#   www.xn--80aad5dfbv.xn--p1ai    = www.статхаб.рф    — редирект на витрину
#   admin.xn--80aad5dfbv.xn--p1ai  = admin.статхаб.рф  — админка организатора
# Один сертификат Let's Encrypt на все три имени, выпускает и продлевает deploy/ssl.sh + сервис certbot.
ssl_certificate     /etc/letsencrypt/live/stathub/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/stathub/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---------- HTTP: только проверка Let's Encrypt и редирект на HTTPS ----------

server {
    listen 80;
    server_name admin.xn--80aad5dfbv.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.xn--80aad5dfbv.xn--p1ai$request_uri;
    }
}

server {
    listen 80;
    server_name xn--80aad5dfbv.xn--p1ai www.xn--80aad5dfbv.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xn--80aad5dfbv.xn--p1ai$request_uri;
    }
}

# ВРЕМЕННО: доступ по IP без HTTPS, пока не заработает DNS домена.
# Убрать вместе с портом 8081 в docker-compose.yml, когда https://статхаб.рф стабильно открывается.
# Витрина: http://91.206.92.28/
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/sites/public;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/stathub-app.conf;
}

# Админка: http://91.206.92.28:8081/
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/sites/admin;
    client_max_body_size 11m;

    include /etc/nginx/snippets/stathub-app.conf;
}

# ---------- HTTPS ----------

# Заход по IP: https://91.206.92.28/ — витрина (например, для Telegram Mini App).
# Отдельный сертификат на IP (ssl.sh, имя ip): живёт ~6 дней, продлевается сервисом certbot.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip/privkey.pem;

    root /usr/share/nginx/sites/public;

    include /etc/nginx/snippets/stathub-app.conf;
}

# Админка по IP: https://91.206.92.28:8443/
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip/privkey.pem;

    root /usr/share/nginx/sites/admin;
    client_max_body_size 11m;

    include /etc/nginx/snippets/stathub-app.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.xn--80aad5dfbv.xn--p1ai;
    return 301 https://xn--80aad5dfbv.xn--p1ai$request_uri;
}

# Публичная витрина: https://статхаб.рф/
server {
    listen 443 ssl;
    http2 on;
    server_name xn--80aad5dfbv.xn--p1ai;

    root /usr/share/nginx/sites/public;

    # Вебхук Telegram-бота. Адрес через переменную + resolver Docker: имя bot резолвится в момент запроса,
    # поэтому nginx стартует, даже если контейнер бота не запущен (тогда просто 502).
    location = /tg/webhook {
        resolver 127.0.0.11 valid=30s;
        set $stathub_bot http://bot:8080;
        proxy_pass $stathub_bot;
        proxy_set_header Connection "";
        client_max_body_size 1m;
    }

    include /etc/nginx/snippets/stathub-app.conf;
}

# Админка организатора: https://admin.статхаб.рф/
server {
    listen 443 ssl;
    http2 on;
    server_name admin.xn--80aad5dfbv.xn--p1ai;

    root /usr/share/nginx/sites/admin;

    # Логотипы до 10 МБ (LogoFile.MaxRequestBytes) + запас на multipart.
    client_max_body_size 11m;

    include /etc/nginx/snippets/stathub-app.conf;
}
