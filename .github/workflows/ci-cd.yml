# Push в dev — сборка и тесты. PR в main ничего не запускает. Merge (push) в main — только деплой API на VPS:
# тесты к этому моменту уже прошли в dev.
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         — IP сервера
#   DEPLOY_USER         — пользователь (shadmin)
#   DEPLOY_SSH_KEY      — приватный ключ, выделенный для CI
#   DEPLOY_KNOWN_HOSTS  — вывод `ssh-keyscan -t ed25519 <IP>`
# Подробно: deploy/README.md, раздел «CI/CD».

name: CI/CD

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Деплой не отменяем: оборванная выкладка хуже, чем дождаться предыдущей.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stathub
          POSTGRES_PASSWORD: stathub
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stathub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Интеграционные тесты сами создают и пересоздают базу stathub_test (StathubApiFactory).
      STATHUB_TEST_POSTGRES: Host=localhost;Port=5432;Username=stathub;Password=stathub;Database=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Stathub.slnx

      - name: Build
        run: dotnet build Stathub.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Stathub.slnx -c Release --no-build

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE: ${{ github.sha }}
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Образ на сервере не собирается: API запускается на готовом aspnet-образе (deploy/docker-compose.yml),
      # а сборка подключается томом. Dev-настройки (в т.ч. dev-ключ JWT), локальные логотипы и
      # BuildHost-* (служебные файлы dotnet ef) в прод не кладём.
      - name: Publish
        run: |
          dotnet publish src/Stathub.WebApi/Stathub.WebApi.csproj \
            -c Release -o publish -p:UseAppHost=false
          rm -f publish/appsettings.Development.json
          rm -rf publish/wwwroot/uploads publish/BuildHost-*
          # Точка монтирования тома с логотипами: каталог приложения смонтирован только на чтение,
          # поэтому создать её при старте контейнера Docker не сможет.
          mkdir -p publish/wwwroot/uploads

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Keepalive: подвисшее соединение рвётся через ~1 мин, а не висит до таймаута джобы.
          printf 'Host *\n  ServerAliveInterval 15\n  ServerAliveCountMax 4\n' > ~/.ssh/config

      # .env, sites/, backups/ и api/releases в репозитории отсутствуют, поэтому rsync их не трогает (без --delete).
      - name: Sync deploy configs
        timeout-minutes: 5
        run: |
          rsync -rtz --timeout=60 --chmod=D755,F644 \
            --exclude '.gitignore' --exclude '.gitattributes' --exclude 'README.md' \
            deploy/ "$TARGET:stathub/"

      # Каждая версия — отдельный каталог api/releases/<sha>, api/current — ссылка на работающую.
      # Первый деплой по этой схеме берёт за основу прежний api/publish.
      - name: Prepare release
        timeout-minutes: 2
        run: |
          ssh "$TARGET" bash -s <<'EOF'
          set -euo pipefail
          cd ~/stathub/api
          mkdir -p releases
          if [ ! -e current ]; then
            if [ -d publish ]; then ln -sfn publish current
            else mkdir -p releases/empty && ln -sfn releases/empty current; fi
          fi
          EOF

      # Неизменившиеся файлы не копируются, а становятся жёсткими ссылками на файлы текущей версии
      # (--link-dest): на диск сервера пишутся только новые DLL. -c сравнивает по содержимому,
      # т.к. mtime после publish всегда новый.
      - name: Upload app
        timeout-minutes: 10
        run: |
          rsync -rcz --delete --timeout=60 --stats --chmod=D755,F644 \
            --link-dest=../../current/ \
            publish/ "$TARGET:stathub/api/releases/$RELEASE/"

      # Запас по времени — на первый деплой: compose один раз скачает закреплённый aspnet-образ.
      - name: Restart services
        timeout-minutes: 20
        run: |
          # Тело скрипта — в { }: bash читает его из stdin целиком до выполнения. Иначе любая
          # команда, читающая stdin (docker compose exec), съедает остаток скрипта, и шаг «успешно»
          # завершается, не переключив версию (так 11–12.11 не доехали три релиза).
          ssh "$TARGET" RELEASE="$RELEASE" bash -s <<'EOF'
          set -euo pipefail
          {
          cd ~/stathub
          chmod +x backup.sh
          DOMAIN=xn--80aad5dfbv.xn--p1ai   # статхаб.рф
          # Метки времени: если шаг зависнет, в логе видно, на какой команде.
          log() { echo "[$(date +%T)] $*"; }

          # Без файла сертификата nginx с ssl-конфигом не стартует: при первом деплое кладём временный.
          log 'ssl.sh ensure'
          bash ssl.sh ensure

          # Переключаем версию. Предыдущая остаётся в api/releases для отката (deploy/README.md).
          ln -sfn "releases/$RELEASE" api/current

          log 'compose up'
          docker compose up -d --remove-orphans
          # Ссылка api/current разрешается при создании контейнера — API пересоздаём явно.
          log 'recreate api'
          docker compose up -d --no-deps --force-recreate api
          # Код бота подключён томом — перезапуск подхватывает новый bot.mjs (пара секунд простоя некритична).
          log 'restart bot'
          docker compose restart bot
          # Изменения в nginx/*.conf подхватываются без пересоздания контейнера.
          log 'nginx reload'
          docker compose exec -T nginx nginx -s reload </dev/null

          log 'ожидание API'
          # Ждём, пока API поднимется (миграции при старте). 502/503/504/000 = API ещё не отвечает,
          # любой другой код (в т.ч. 404 на несуществующий путь) = Kestrel работает.
          # По HTTP nginx отвечает только редиректом, поэтому идём на HTTPS локально
          # (-k: при первом деплое сертификат ещё временный).
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' \
              --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/" || true)
            case "$code" in
              502|503|504|000) sleep 2 ;;
              *) echo "API отвечает (HTTP $code)"; break ;;
            esac
            if [ "$i" -eq 60 ]; then
              echo "API не поднялся за 2 минуты"
              docker compose logs --tail=100 api
              exit 1
            fi
          done

          # Храним текущую и 4 предыдущие версии, остальные удаляем (диск всего 20 ГБ).
          log 'чистка старых версий'
          cd api/releases
          ls -1t | grep -vx -e "$RELEASE" -e empty | tail -n +5 | xargs -r rm -rf

          # Если сертификат ещё временный — выпускаем настоящий (дальше его продлевает сервис certbot).
          # Ошибка здесь валит деплой намеренно: с временным сертификатом браузеры показывают предупреждение.
          cd ~/stathub
          log 'ssl.sh issue'
          bash ssl.sh issue

          # Страховка: версия действительно переключена.
          test "$(readlink api/current)" = "releases/$RELEASE"
          log 'готово'
          }
          EOF
