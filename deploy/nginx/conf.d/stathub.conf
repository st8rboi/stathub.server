server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

upstream stathub_api {
    server api:8080;
    keepalive 16;
}

# Для WebSocket (SignalR) передаём Upgrade, для обычных запросов держим keepalive к API.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Домены (punycode):
#   xn--80aad5dfbv.xn--p1ai        = статхаб.рф        — публичная витрина
#   www.xn--80aad5dfbv.xn--p1ai    = www.статхаб.рф    — редирект на витрину
#   admin.xn--80aad5dfbv.xn--p1ai  = admin.статхаб.рф  — админка организатора
# Один сертификат Let's Encrypt на все три имени, выпускает и продлевает deploy/ssl.sh + сервис certbot.
ssl_certificate     /etc/letsencrypt/live/stathub/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/stathub/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---------- HTTP: только проверка Let's Encrypt и редирект на HTTPS ----------

server {
    listen 80;
    server_name admin.xn--80aad5dfbv.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://admin.xn--80aad5dfbv.xn--p1ai$request_uri;
    }
}

# Витрина, www и заход по IP — всё ведём на https://статхаб.рф.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xn--80aad5dfbv.xn--p1ai$request_uri;
    }
}

# ---------- HTTPS ----------

# Неизвестное имя (заход по IP и т.п.) — закрываем соединение, а не отдаём сайт с чужим сертификатом.
server {
    listen 443 ssl default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.xn--80aad5dfbv.xn--p1ai;
    return 301 https://xn--80aad5dfbv.xn--p1ai$request_uri;
}

# Публичная витрина: https://статхаб.рф/
server {
    listen 443 ssl;
    http2 on;
    server_name xn--80aad5dfbv.xn--p1ai;

    root /usr/share/nginx/sites/public;

    include /etc/nginx/snippets/stathub-app.conf;
}

# Админка организатора: https://admin.статхаб.рф/
server {
    listen 443 ssl;
    http2 on;
    server_name admin.xn--80aad5dfbv.xn--p1ai;

    root /usr/share/nginx/sites/admin;

    # Логотипы до 10 МБ (LogoFile.MaxRequestBytes) + запас на multipart.
    client_max_body_size 11m;

    include /etc/nginx/snippets/stathub-app.conf;
}
