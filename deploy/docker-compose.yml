# Прод-стек Stathub для одного VPS (2 ГБ RAM). Запуск из каталога с этим файлом:
#   docker compose up -d
# Секреты — в .env рядом (шаблон: .env.example). Инструкция: README.md.

name: stathub

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stathub
      POSTGRES_USER: stathub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    # Настройки под маленький сервер: память ограничена 512 МБ на контейнер.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт открыт ТОЛЬКО на localhost сервера — для подключения через SSH-туннель (DBeaver и т.п.).
    # Никогда не писать "5432:5432" без 127.0.0.1: Docker обходит ufw, и БД станет видна из интернета.
    # API ходит в БД по внутренней сети compose, этот порт ему не нужен.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stathub -d stathub"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  api:
    image: ${API_IMAGE:-stathub-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Доверять X-Forwarded-For/Proto от nginx (иначе лимит попыток входа считается по IP nginx).
      # Безопасно, потому что порт API наружу не опубликован — достучаться можно только через nginx.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Gss Encryption Mode=Disable: БД во внутренней сети, Kerberos не нужен — без этого Npgsql при каждом
      # подключении пытается загрузить libgssapi_krb5 (её нет в образе) и пишет ошибку в лог.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=stathub;Username=stathub;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
      Jwt__Key: ${JWT_KEY:?Задайте JWT_KEY в .env}
    volumes:
      - uploads:/app/wwwroot/uploads
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"   # редирект на HTTPS + проверка Let's Encrypt
      - "443:443" # витрина (статхаб.рф) и админка (admin.статхаб.рф)
      - "8081:8081" # ВРЕМЕННО: админка по IP без HTTPS, пока не работает DNS домена
      - "8443:8443" # ВРЕМЕННО: запасной HTTPS-вход (https://статхаб.рф:8443), пока 443 режется ТСПУ
    # Раз в 6 ч перечитываем конфиг, чтобы подхватить продлённый сертификат.
    # exec — чтобы nginx был PID 1 и корректно получал SIGTERM при остановке.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Монтируется родительский каталог: при замене sites/public или sites/admin целиком
      # nginx сразу видит новую сборку без перезапуска.
      - ./sites:/usr/share/nginx/sites:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

  # Telegram-бот (открывает mini app). Работает через вебхук: Telegram → nginx (/tg/webhook) → bot,
  # отвечает в теле ответа, сам в api.telegram.org не ходит (из РФ недоступен). Токен здесь не нужен.
  # Настройка вебхука и кнопки меню — с локального компьютера: deploy/README.md, раздел «Telegram-бот».
  # Код подключён томом: после изменения bot.mjs нужен docker compose restart bot (CI делает это сам).
  bot:
    image: node:22-alpine
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "bot.mjs"]
    environment:
      WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
      BOT_USERNAME: ${BOT_USERNAME:-}
    volumes:
      - ./bot:/app:ro
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

  # Продление сертификата Let's Encrypt. Первичный выпуск — deploy/ssl.sh.
  # Пока сертификата нет, renew ничего не делает.
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

volumes:
  pgdata:
  uploads:
