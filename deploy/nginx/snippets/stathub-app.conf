# Общая часть для обеих SPA. Клиенты ходят в API по /api/* (префикс срезается, как в dev-прокси Vite),
# в SignalR по /hubs/*, за логотипами по /uploads/*.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

location /api/ {
    proxy_pass http://stathub_api/;
}

location /hubs/ {
    proxy_pass http://stathub_api;
    # Соединения зрителей живут долго; буферизация мешает SSE/long polling.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}

location /uploads/ {
    proxy_pass http://stathub_api;
    expires 7d;
}

# Файлы сборки Vite с хэшем в имени — кэшируем надолго.
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA-роутинг: все неизвестные пути отдают index.html, его не кэшируем.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
